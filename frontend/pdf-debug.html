<!DOCTYPE html>
<html>
<head><title>PDF Debug</title></head>
<body>
<input type="file" id="f" accept=".pdf">
<button onclick="run()">Inspect PDF</button>
<pre id="out" style="font-size:12px;background:#f5f5f5;padding:16px;margin-top:16px;white-space:pre-wrap;word-break:break-all;"></pre>
<script>
async function run() {
    const file = document.getElementById('f').files[0];
    if (!file) return;
    const token = localStorage.getItem('token') || localStorage.getItem('authToken') || '';
    const fd = new FormData();
    fd.append('pdf', file);
    const r = await fetch('http://localhost:5000/pdf/debug', {
        method: 'POST',
        headers: token ? { 'Authorization': 'Bearer ' + token } : {},
        body: fd
    });
    const d = await r.json();
    document.getElementById('out').textContent =
        'PDF INFO:\n' + JSON.stringify(d.info, null, 2) +
        '\n\nLINES:\n' + (d.lines || []).join('\n');
}
</script>
</body>
</html>
